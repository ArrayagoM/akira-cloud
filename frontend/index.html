  <noscript>
    <header>
      <h1>Akira Cloud — Bot de WhatsApp con IA para tu negocio</h1>
      <p><strong>Akira Cloud</strong> es un <strong>programa para Windows</strong>, hecho en Argentina, que pone un
        asistente de WhatsApp con inteligencia artificial a atender a tus clientes, agendar turnos, cobrar con MercadoPago
        y tomar pedidos, y que además te ayuda a ordenar el negocio: caja, clientes, stock y reportes.

    <main>
      <section>
        <h2>Qué hace el bot de WhatsApp</h2>
        <ul>
          <li><strong>Atiende las 24 horas</strong> con lenguaje natural: precios, horarios, dirección, medios de pago.</li>
          <li><strong>Agenda turnos</strong> con recordatorios automáticos 24 h, 4 h y 30 min antes (y Google Calendar opcional).</li>
          <li><strong>Cobra con MercadoPago</strong> (link de pago, seña configurable por servicio) o por transferencia con alias/CBU.</li>
          <li><strong>Toma pedidos por WhatsApp</strong>: arma el carrito, calcula el total, genera el link de pago y descuenta el stock al cobrar.</li>
          <li><strong>Usa tu información</strong>: subís un PDF de preguntas frecuentes y el bot lo usa; manda fotos de tus productos; responde fuera de horario.</li>
          <li><strong>Entiende audios</strong> (transcripción) y <strong>te pasa la posta</strong>: si no sabe algo, te avisa y deriva a una persona.</li>

          <li><strong>Deudores y proveedores</strong> (cuentas corrientes), <strong>stock</strong> y <strong>ventas de mostrador</strong> con código de barras.</li>
          <li><strong>Presupuestos y recibos en PDF</strong> con tu logo, enviados por WhatsApp; conciliación de cobros con MercadoPago.</li>
          <li><strong>Clientes</strong>: ficha completa, importación desde Excel, fidelidad, pedido de reseñas y mensajes a grupos (con baja voluntaria).</li>

          <li><strong>Equipo</strong>: perfiles con PIN (empleado / encargado), profesionales con comisiones y sucursales.</li>
          <li><strong>Seguridad</strong>: respaldo cifrado con contraseña, claves protegidas por Windows, resumen del día por WhatsApp, alertas por email y al celular si el bot se desconecta.</li>

          Hay plantillas por rubro (peluquería, consultorio, gimnasio, veterinaria, restaurante, alojamiento y más) para empezar en minutos.</p>

          alquileres temporarios, restaurantes, talleres y comercios</strong>.</p>
