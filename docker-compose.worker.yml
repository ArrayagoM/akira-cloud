# docker-compose.worker.yml
# Corre SOLO el worker de bots en tu PC local.
# El backend sigue en Railway/Render — este archivo no lo toca.
#
# Uso:
#   docker compose -f docker-compose.worker.yml up -d        ← arrancar
#   docker compose -f docker-compose.worker.yml logs -f      ← ver logs
#   docker compose -f docker-compose.worker.yml restart      ← reiniciar
#   docker compose -f docker-compose.worker.yml down         ← apagar

version: '3.9'

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: akira-worker
    restart: always   # Si crashea, Docker lo levanta solo automáticamente

    env_file:
      - ./worker/.env   # RENDER_URL, WORKER_SECRET, MONGO_URI, ENCRYPTION_KEY

    environment:
      WA_SESSIONS_PATH: /app/sessions
      NODE_ENV: production

    volumes:
      # Sesiones de WhatsApp — persistentes entre reinicios del container
      - ./sessions:/app/sessions
      # Logs del worker — accesibles desde tu PC en ./logs/
      - ./logs:/app/logs

    # El worker NO expone puertos — solo se conecta HACIA el backend (Socket.io outbound)
    # No necesita firewall ni port-forwarding

    # Límite de memoria — evita que un bot con leak consuma toda la RAM
    mem_limit: 1g
    memswap_limit: 1g

    # Healthcheck: verifica que el proceso Node siga vivo cada 30s
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(0))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # Máximo 10MB por archivo de log
        max-file: "3"     # Máximo 3 archivos rotados = 30MB total
