# Arma la app nativa de Akira para Android (.apk) en un servidor de GitHub. No necesita cuentas externas.
# Se corre a mano: pestaña Actions → "Armar Akira para Android" → Run workflow. Al terminar, el .apk queda en una
# pre-release "android-prueba-N" (de ahí lo toma la página de descarga) y también como artifact.
#
# Firma: si están cargados los 4 secretos ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD
# (ver docs/ANDROID-FIRMA-Y-ACTUALIZACION.md), el .apk se firma con la clave FIJA de Akira: así cada versión nueva se instala encima de
# la anterior sin desinstalar y la app se actualiza sola (la app avisa y baja la nueva). Sin esos secretos sale con una clave de prueba
# que cambia en cada armado (como antes): para actualizar hay que desinstalar la versión anterior.
# Además de la pre-release "android-prueba-N", cada armado deja el .apk y un android-version.json en la release de nombre fijo
# "android-actual": de ahí lo toman la página de descarga y la propia app, sin tocar ninguna variable de entorno.
# Avisos (push): necesitan además un proyecto de Expo (projectId) y las credenciales de Firebase; mientras no estén,
# la app funciona igual (estado, resumen, pausar) y en Ajustes explica que los avisos todavía no están vinculados.
name: Armar Akira para Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://akira-licencias.vercel.app/api
      EXPO_NO_TELEMETRY: '1'
      CLAVE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      CLAVE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CLAVE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CLAVE_PASS_ALIAS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias de la app
        working-directory: mobile
        run: npm ci

      - name: Probar la lógica de la app
        working-directory: mobile
        run: npm test

      - name: Fijar la versión interna (versionCode) y si la firma es la fija
        working-directory: mobile
        run: |
          # Solo en este armado (no se guarda en el repositorio): el versionCode sube solo con cada armado, así la app sabe cuál es más nueva.
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            j.expo.android = { ...(j.expo.android || {}), versionCode: Number(process.env.RUN) + 100 };
            j.expo.extra = { ...(j.expo.extra || {}), firmaEstable: process.env.CLAVE_B64 !== '' };
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
            console.log('versionCode', j.expo.android.versionCode, '| firma fija:', j.expo.extra.firmaEstable);
          "
        env:
          RUN: ${{ github.run_number }}

      - name: Generar el proyecto Android
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Armar el .apk
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Preparar el archivo
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK armado: $APK"
          cp "$APK" Akira-android.apk
          ls -l Akira-android.apk
          # Verificación: la firma tiene que ser válida y el paquete tiene que ser el de Akira (si no, el armado falla).
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/apksigner" verify --verbose --print-certs Akira-android.apk
          "$BT/aapt" dump badging Akira-android.apk | grep -E "^(package|application-label|sdkVersion|targetSdkVersion)"
          "$BT/aapt" dump badging Akira-android.apk | grep -q "package: name='lat.akiracloud.app'"

      - name: Firmar con la clave fija de Akira (si está cargada)
        if: env.CLAVE_B64 != ''
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$CLAVE_B64" | base64 -d > "$RUNNER_TEMP/akira.p12"
          "$BT/zipalign" -f -p 4 Akira-android.apk "$RUNNER_TEMP/alineado.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/akira.p12" --ks-type PKCS12 --ks-key-alias "$CLAVE_ALIAS" \
            --ks-pass env:CLAVE_PASS --key-pass env:CLAVE_PASS_ALIAS --out Akira-android-firmado.apk "$RUNNER_TEMP/alineado.apk"
          rm -f "$RUNNER_TEMP/akira.p12" "$RUNNER_TEMP/alineado.apk"
          mv Akira-android-firmado.apk Akira-android.apk
          "$BT/apksigner" verify --verbose --print-certs Akira-android.apk | tee "$RUNNER_TEMP/certs.txt"
          # Tiene que haber UNA sola firma y el paquete tiene que seguir siendo el de Akira.
          test "$(grep -c 'Number of signers: 1' "$RUNNER_TEMP/certs.txt")" = "1"
          "$BT/aapt" dump badging Akira-android.apk | grep -q "package: name='lat.akiracloud.app'"

      - name: Escribir android-version.json
        run: |
          node -e "
            const fs = require('fs'); const crypto = require('crypto'); const { execSync } = require('child_process');
            const app = JSON.parse(fs.readFileSync('mobile/app.json', 'utf8')).expo;
            const buf = fs.readFileSync('Akira-android.apk');
            const v = {
              versionCode: app.android.versionCode, versionName: app.version, sha256: crypto.createHash('sha256').update(buf).digest('hex'),
              sizeMB: Math.round(buf.length / 104857.6) / 10, firmaEstable: process.env.CLAVE_B64 !== '',
              notas: execSync('git log -1 --pretty=%s').toString().trim(),
            };
            fs.writeFileSync('android-version.json', JSON.stringify(v, null, 2));
            console.log(v);
          "

      - name: Subir como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Akira-para-Android
          path: Akira-android.apk
          if-no-files-found: error
          retention-days: 14

      - name: Dejar el .apk en una pre-release (de ahí lo toma la página de descarga)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-prueba-${{ github.run_number }}" Akira-android.apk \
            --prerelease --title "Akira para Android (prueba ${{ github.run_number }})" \
            --notes "App nativa de Akira para Android, versión de prueba (firma de prueba: para actualizar, desinstalar la anterior). Descarga desde akiracloud.lat/descargar."

      - name: Actualizar la release fija "android-actual" (de ahí toman la última versión la página de descarga y la propia app)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Se crea la primera vez y después se reemplazan sus archivos (las direcciones no cambian nunca).
          gh release view android-actual >/dev/null 2>&1 || gh release create android-actual --prerelease --title "Akira para Android (última)" \
            --notes "Última versión de la app de Android. La toman la página de descarga y la propia app para actualizarse. No borrar."
          # Primero el .apk y después el archivo de versión: así el archivo de versión nunca apunta a un .apk que todavía no está.
          gh release upload android-actual Akira-android.apk --clobber
          gh release upload android-actual android-version.json --clobber
