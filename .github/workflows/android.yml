# Arma la app nativa de Akira para Android (.apk) en un servidor de GitHub. No necesita cuentas externas.
# Se corre a mano: pestaña Actions → "Armar Akira para Android" → Run workflow. Al terminar, el .apk queda en una
# pre-release "android-prueba-N" (de ahí lo toma la página de descarga) y también como artifact.
#
# Firma: el .apk sale firmado con una clave de prueba que genera el propio armado (Gradle). Sirve para instalar directo
# desde la web ("orígenes desconocidos"), pero como esa clave cambia en cada armado, para actualizar hay que desinstalar
# la versión anterior. Para una clave fija y publicar en tiendas hará falta una cuenta de Expo/Google.
# Avisos (push): necesitan además un proyecto de Expo (projectId) y las credenciales de Firebase; mientras no estén,
# la app funciona igual (estado, resumen, pausar) y en Ajustes explica que los avisos todavía no están vinculados.
name: Armar Akira para Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://akira-licencias.vercel.app/api
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias de la app
        working-directory: mobile
        run: npm ci

      - name: Probar la lógica de la app
        working-directory: mobile
        run: npm test

      - name: Generar el proyecto Android
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Armar el .apk
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Preparar el archivo
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK armado: $APK"
          cp "$APK" Akira-android.apk
          ls -l Akira-android.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs Akira-android.apk | head -3 || true
          "$ANDROID_HOME"/build-tools/*/aapt dump badging Akira-android.apk | grep -E "^(package|application-label|sdkVersion|targetSdkVersion)" || true

      - name: Subir como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Akira-para-Android
          path: Akira-android.apk
          if-no-files-found: error
          retention-days: 14

      - name: Dejar el .apk en una pre-release (de ahí lo toma la página de descarga)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-prueba-${{ github.run_number }}" Akira-android.apk \
            --prerelease --title "Akira para Android (prueba ${{ github.run_number }})" \
            --notes "App nativa de Akira para Android, versión de prueba (firma de prueba: para actualizar, desinstalar la anterior). Descarga desde akiracloud.lat/descargar."
