# Arma la app de escritorio de Akira para macOS (Apple Silicon e Intel) en un servidor Mac de GitHub.
# Se corre a mano: pestaña Actions → "Armar Akira para Mac" → Run workflow. Al terminar, los .dmg
# quedan en "Artifacts" de esa ejecución (se bajan como .zip). NO publica nada ni toca el sitio.
# La app sale sin firma de Apple (hace falta una cuenta de pago para eso): ver docs/INSTALAR-EN-MAC.md.
name: Armar Akira para Mac

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias de la interfaz
        working-directory: frontend
        run: npm ci

      - name: Instalar dependencias del programa
        working-directory: desktop
        run: npm ci

      - name: Compilar la interfaz
        working-directory: desktop
        run: npm run build:ui

      - name: Armar los instaladores (.dmg)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Subir los instaladores
        uses: actions/upload-artifact@v4
        with:
          name: Akira-para-Mac
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      # Además del artifact, deja los .dmg en una "pre-release" para poder bajarlos sin iniciar sesión en GitHub.
      # Después se mueven al hosting propio y la pre-release se puede borrar.
      - name: Dejar los instaladores en una pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mac-prueba-${{ github.run_number }}" desktop/dist/*.dmg             --prerelease --title "Akira para Mac (prueba ${{ github.run_number }})"             --notes "Versión de prueba para Mac, sin firma de Apple. Guía: docs/INSTALAR-EN-MAC.md"
